# brave 2+1' 连接档 —— node-3（中间件全家桶 + cs-3 ~5G / 12-18 万连接）
# 来源：docs/kernel-tuning.md §3「2+1' 连接档 node-3」。缓冲沿用练手档：连接少 + pagecache 留给 PG/Kafka。
# 应用：先装 docker（nf_conntrack 随 iptables 加载），再 sudo cp 本文件 /etc/sysctl.d/99-zz-brave.conf
#       && sudo sysctl --system + sed 掉 /etc/sysctl.conf 里云镜像预置的 somaxconn=4096（最后应用压 drop-in）

# 每连接收/发缓冲：256KB 档（kernel-tuning.md §9：禁止在 etcd/Kafka 机上激进调大 tcp_mem）
net.ipv4.tcp_rmem = 4096 8192 262144
net.ipv4.tcp_wmem = 4096 8192 262144

# 全局 TCP 页缓存：9.5G 可用折算，偏保守
net.ipv4.tcp_mem = 629145 1258291 1887437

net.core.somaxconn = 65535
net.core.netdev_max_backlog = 262144
net.ipv4.ip_local_port_range = 1024 65000
net.ipv4.tcp_tw_reuse = 1

net.ipv4.tcp_keepalive_time = 600
net.ipv4.tcp_keepalive_intvl = 60
net.ipv4.tcp_keepalive_probes = 3

vm.swappiness = 1
vm.overcommit_memory = 1

# conntrack 方案 B（本机跑 docker 无法整关）：表项上限 100 万，压测期盯 /proc/net/nf_conntrack_count
# 该 key 仅在 nf_conntrack 模块加载后存在；未加载时 systemd-sysctl 会跳过（无害）
net.netfilter.nf_conntrack_max = 1048576
