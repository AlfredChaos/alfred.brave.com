# brave 2+1' 连接档 fd 限制 —— node-3（中间件 + cs-3 ~15 万连接）
# 来源：docs/kernel-tuning.md §3 node-3 档（50 万）。
# 仅作用于登录 shell；systemd 服务由 unit 内 LimitNOFILE=500000 承担。
# 应用：sudo cp 本文件 /etc/security/limits.d/99-brave.conf
*    soft  nofile  500000
*    hard  nofile  500000
root soft  nofile  500000
root hard  nofile  500000
*    soft  nproc   65536
*    hard  nproc   65536
