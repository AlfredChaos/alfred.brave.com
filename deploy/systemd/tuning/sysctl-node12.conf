# brave 2+1' 连接档 —— node-1 / node-2（cs 独占台，目标 25-30 万连接/台）
# 来源：docs/kernel-tuning.md §3「2+1' 连接档 node-1/2」。勿用于 node-3（tcp_mem 按角色折算不同）。
# 应用：sudo cp 本文件 /etc/sysctl.d/99-zz-brave.conf && sudo sysctl --system
#       + sed 掉 /etc/sysctl.conf 里云镜像预置的 somaxconn=4096（它最后应用，压掉一切 drop-in）
# 注意：node-1/2 在 S1/S2 阶段不装 docker → nf_conntrack 保持未加载即"关"；
#       切混部（S3）装 docker 后必须按 kernel-tuning.md §3 方案 B 调大 nf_conntrack_max。

# 每连接收/发缓冲：IM 小消息（~1KB）压小默认值，512KB 保留突发余量
net.ipv4.tcp_rmem = 4096 8192 524288
net.ipv4.tcp_wmem = 4096 8192 524288

# 全局 TCP 页缓存（页=4KB）：30 万连接 × ~24KB 内核侧 ≈ 189 万页；压力线 60% / 上限 75%
net.ipv4.tcp_mem = 943718 1887437 2516582

# 建连风暴：压测机瞬间打连接时防 SYN 丢弃（节点同时是回环压测客户端，必调）
net.core.somaxconn = 65535
net.core.netdev_max_backlog = 262144
net.ipv4.ip_local_port_range = 1024 65000
net.ipv4.tcp_tw_reuse = 1

# keepalive 交给应用层心跳（D14），内核 keepalive 仅兜底
net.ipv4.tcp_keepalive_time = 600
net.ipv4.tcp_keepalive_intvl = 60
net.ipv4.tcp_keepalive_probes = 3

# 内存与调度（kernel-tuning.md §4；GOMEMLIMIT 与 overcommit 必须成对，见 §9）
vm.swappiness = 1
vm.overcommit_memory = 1
