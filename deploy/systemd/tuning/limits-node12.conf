# brave 2+1' 连接档 fd 限制 —— node-1 / node-2（cs 独占 25-30 万连接/台）
# 来源：docs/kernel-tuning.md §3。30 万连接 + PG/kafka/日志余量 ≈ 65 万需求，取 80 万。
# 仅作用于登录 shell（压测 worker、手工运维）；systemd 服务由 unit 内 LimitNOFILE=800000 承担。
# 应用：sudo cp 本文件 /etc/security/limits.d/99-brave.conf
*    soft  nofile  800000
*    hard  nofile  800000
root soft  nofile  800000
root hard  nofile  800000
*    soft  nproc   65536
*    hard  nproc   65536
