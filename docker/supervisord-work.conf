# 托管 work 容器内的两个进程：etcd（集群成员）+ joker（IM 内核）。
# 日志直接打到 stdout/stderr，便于 docker logs 查看。

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

# etcd：由 etcd-bootstrap.sh 用环境变量拼参数启动；priority 低，先于 joker 起来。
[program:etcd]
command=/etcd-bootstrap.sh
priority=10
autostart=true
autorestart=true
startretries=3
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# joker：先等本地 etcd 健康，再启动；避免 joker 连不上 etcd 导致服务注册/登录态写入失败。
[program:joker]
command=/bin/bash -c "until etcdctl --endpoints=127.0.0.1:2379 endpoint health >/dev/null 2>&1; do echo '[joker] waiting for local etcd...'; sleep 1; done; exec /app/brave joker"
priority=20
autostart=true
autorestart=true
startretries=5
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
