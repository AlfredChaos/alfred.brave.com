<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Brave IM</title>
<link rel="stylesheet" href="style.css"/>
</head>
<body>

<!-- ============ 登录 / 设置（全屏覆盖层，登录成功后隐藏；点导航"设置"再次唤出） ============ -->
<div id="settings-view" class="view">
  <button id="btn-close-settings" class="close-x hidden" title="返回">&#10005;</button>
  <div class="auth-card">
    <div class="auth-brand">
      <span class="logo"><svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="M12 3C6.9 3 2.8 6.6 2.8 11c0 2.3 1.1 4.3 2.9 5.8-.1 1-.5 2.3-1.6 3.5 1.9-.2 3.4-1 4.4-1.8 1.1.3 2.3.5 3.5.5 5.1 0 9.2-3.6 9.2-8S17.1 3 12 3z"/></svg></span>
      <div>
        <div class="brand-name">Brave IM</div>
        <div class="brand-sub">分布式即时通讯 · 测试客户端</div>
      </div>
    </div>

    <div class="field">
      <label for="acct-user">用户名</label>
      <input id="acct-user" placeholder="字母 / 数字 / 中文，3-32 位"/>
    </div>
    <div class="field">
      <label for="acct-pass">密码</label>
      <input id="acct-pass" type="password" placeholder="8 位以上，含字母和数字"/>
    </div>
    <div class="row auth-btns">
      <button id="btn-register">注册</button>
      <button id="btn-login" class="primary">登录</button>
    </div>
    <p id="acct-result" class="muted center"></p>

    <div class="auth-divider"><span>连接</span></div>
    <div class="field compact">
      <label for="gw-input">网关地址</label>
      <div class="row">
        <input id="gw-input" placeholder="http://127.0.0.1:37001"/>
        <button id="btn-test-gw">测试</button>
      </div>
      <p id="gw-test-result" class="muted">默认本机网关，一般无需修改。</p>
    </div>
    <label class="checkbox"><input type="checkbox" id="ws-override-toggle"/> WS 地址覆盖（跨节点调试）</label>
    <label id="ws-override-row" class="checkbox hidden">WS 地址 <input id="ws-override-input" placeholder="127.0.0.1:37002"/></label>
  </div>
</div>

<!-- ============ 主界面：导航 64px ｜ 列表 300px ｜ 内容自适应 ============ -->
<div id="app-view" class="app hidden">

  <!-- 第一栏：深色导航（聊天 / 通讯录 / 朋友圈 / 设置） -->
  <nav class="dock">
    <div class="dock-me" id="whoami" title="未登录"><span id="ws-dot" class="ws-dot off" title="连接状态"></span></div>
    <div class="dock-sep"></div>
    <button data-tab="chat" class="tab active" title="聊天">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M12 3C6.9 3 2.8 6.6 2.8 11c0 2.3 1.1 4.3 2.9 5.8-.1 1-.5 2.3-1.6 3.5 1.9-.2 3.4-1 4.4-1.8 1.1.3 2.3.5 3.5.5 5.1 0 9.2-3.6 9.2-8S17.1 3 12 3z"/></svg>
    </button>
    <button data-tab="contacts" class="tab" title="通讯录">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.4"/><path d="M2.8 19c.9-3 3.3-4.6 6.2-4.6s5.3 1.6 6.2 4.6"/><circle cx="17" cy="9.4" r="2.6"/><path d="M15.6 14.6c2.8.2 4.8 1.7 5.6 4.4"/></svg>
    </button>
    <button data-tab="feed" class="tab" title="朋友圈">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.5"/></svg>
    </button>
    <div class="dock-flex"></div>
    <button data-tab="settings" class="tab" title="设置 / 切换账号">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><circle cx="9" cy="7" r="2.4" fill="#2E2E2E"/><line x1="4" y1="17" x2="20" y2="17"/><circle cx="15" cy="17" r="2.4" fill="#2E2E2E"/></svg>
    </button>
  </nav>

  <!-- 聊天：统一会话列表（单聊 + 群聊同级） -->
  <section id="tab-chat" class="tabpane">
    <div class="side">
      <div class="side-head row-head">聊天
        <button id="btn-new-group" class="mini" title="发起群聊（以当前聊天对象为初始成员）">＋ 群聊</button>
      </div>
      <div id="group-create-row" class="row side-row hidden">
        <input id="group-name-input" placeholder="群名"/>
        <button id="btn-create-group">创建</button>
      </div>
      <div class="row side-row"><input id="chat-search" placeholder="搜索用户名"/><button id="btn-search-users">找用户</button></div>
      <ul id="user-list" class="list add-list"></ul>
      <div class="side-head side-sub">会话</div>
      <ul id="session-list" class="list"></ul>
    </div>
    <div class="main">
      <div id="conv-title" class="pane-title">选择一个会话开始聊天</div>
      <div id="chat-log" class="log"></div>
      <div class="composer">
        <div id="chat-resize" class="resize-handle" title="拖动调整输入框高度"><span></span></div>
        <textarea id="chat-input" rows="2" placeholder="输入消息，Enter 发送，Shift+Enter 换行；群里输入 @所有人 或 @all 可通知全员"></textarea>
      </div>
    </div>
  </section>

  <!-- 通讯录：好友列表 + 搜索加好友 -->
  <section id="tab-contacts" class="tabpane hidden">
    <div class="side">
      <div class="side-head">通讯录</div>
      <div class="row side-row"><input id="contact-search" placeholder="搜索好友"/><button id="btn-search-users2">找用户</button></div>
      <div class="side-head side-sub">好友</div>
      <ul id="friend-list" class="list"></ul>
    </div>
    <main class="main">
      <div class="pane-title">选择好友开始聊天</div>
      <div id="contact-detail" class="center-holder muted">在左侧选择好友，或用上方搜索添加新朋友。</div>
    </main>
  </section>

  <!-- 朋友圈 -->
  <section id="tab-feed" class="tabpane hidden">
    <div class="side">
      <div class="side-head">朋友圈</div>
      <textarea id="post-text" placeholder="发点什么…（≤2000 字）"></textarea>
      <button id="btn-publish" class="primary block">发布</button>
    </div>
    <div class="main feed-main">
      <div class="pane-title">动态</div>
      <div id="feed-list" class="feed-scroll"></div>
      <div class="feed-more"><button id="btn-feed-more">加载更多</button></div>
    </div>
  </section>

</div>
<script src="app.js"></script>
</body>
</html>
