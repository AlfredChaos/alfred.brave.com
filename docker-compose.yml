# 一键部署：1 mysql + 3 work(etcd+joker 同容器) + 1 server
#   docker compose up -d --build
# server 通过 etcd 服务发现拿到 3 个 joker，登录时随机选一个(getServiceByRandom)。
name: brave

services:
  # ---------- 业务库 ----------
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: brave
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [brave-net]
    restart: unless-stopped

  # ---------- work 节点 ×3：每容器 etcd(集群成员) + joker(IM 内核) ----------
  # 注意：etcd 配置全部用其标准环境变量(ETCD_*)，etcd 自行读取，不要再用命令行 flag 重复传。
  work-1:
    build: .
    image: brave:latest
    command: ["work"]
    environment:
      ETCD_NAME: etcd-1
      ETCD_DATA_DIR: /data/etcd
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://work-1:2380
      ETCD_ADVERTISE_CLIENT_URLS: http://work-1:2379
      ETCD_INITIAL_CLUSTER: etcd-1=http://work-1:2380,etcd-2=http://work-2:2380,etcd-3=http://work-3:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: brave-etcd
      # joker 注册地址（非 etcd 变量，供 joker.yaml.tmpl 的 envsubst 使用）
      ADVERTISE_HOST: work-1
    volumes:
      - etcd-1-data:/data
    healthcheck:
      test: ["CMD-SHELL", "etcdctl --endpoints=127.0.0.1:2379 endpoint health >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    networks: [brave-net]
    restart: unless-stopped

  work-2:
    build: .
    image: brave:latest
    command: ["work"]
    environment:
      ETCD_NAME: etcd-2
      ETCD_DATA_DIR: /data/etcd
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://work-2:2380
      ETCD_ADVERTISE_CLIENT_URLS: http://work-2:2379
      ETCD_INITIAL_CLUSTER: etcd-1=http://work-1:2380,etcd-2=http://work-2:2380,etcd-3=http://work-3:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: brave-etcd
      ADVERTISE_HOST: work-2
    volumes:
      - etcd-2-data:/data
    healthcheck:
      test: ["CMD-SHELL", "etcdctl --endpoints=127.0.0.1:2379 endpoint health >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    networks: [brave-net]
    restart: unless-stopped

  work-3:
    build: .
    image: brave:latest
    command: ["work"]
    environment:
      ETCD_NAME: etcd-3
      ETCD_DATA_DIR: /data/etcd
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://work-3:2380
      ETCD_ADVERTISE_CLIENT_URLS: http://work-3:2379
      ETCD_INITIAL_CLUSTER: etcd-1=http://work-1:2380,etcd-2=http://work-2:2380,etcd-3=http://work-3:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: brave-etcd
      ADVERTISE_HOST: work-3
    volumes:
      - etcd-3-data:/data
    healthcheck:
      test: ["CMD-SHELL", "etcdctl --endpoints=127.0.0.1:2379 endpoint health >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    networks: [brave-net]
    restart: unless-stopped

  # ---------- 业务 HTTP API ----------
  server:
    build: .
    image: brave:latest
    command: ["server"]
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: brave
      ETCD_ENDPOINTS: work-1:2379,work-2:2379,work-3:2379
    ports:
      - "37001:37001"
    depends_on:
      mysql: { condition: service_healthy }
      work-1: { condition: service_healthy }
      work-2: { condition: service_healthy }
      work-3: { condition: service_healthy }
    networks: [brave-net]
    restart: unless-stopped

volumes:
  mysql-data:
  etcd-1-data:
  etcd-2-data:
  etcd-3-data:

networks:
  brave-net:
    driver: bridge
